<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>{{ nome }} - Portfólio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/android.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='jsdos/js-dos/js-dos.css') }}">
    <script>var emulatorsPathPrefix = "{{ url_for('static', filename='jsdos/js-dos/') }}";</script>
    <script src="{{ url_for('static', filename='jsdos/js-dos/js-dos.js') }}"></script>
    <script>if (typeof emulators !== 'undefined') emulators.pathPrefix = emulatorsPathPrefix;</script>
</head>
<body class="touch-device">
<div id="phone">

    <!-- Barra de status -->
    <div id="statusbar">
        <span id="sb-clock">--:--</span>
        <span class="sb-right">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 18.5l2.1-2.4a3 3 0 0 0-4.2 0L12 18.5zm0-5.6a6.2 6.2 0 0 1 4.4 1.8l1.5-1.7a8.5 8.5 0 0 0-11.8 0l1.5 1.7A6.2 6.2 0 0 1 12 12.900zM12 7.300c3 0 5.700 1.200 7.700 3.200L21.200 8.800A12.600 12.600 0 0 0 12 5 12.600 12.600 0 0 0 2.800 8.800l1.500 1.700a10.900 10.900 0 0 1 7.700-3.200z"/></svg>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17 5v16H7V5h3V3h4v2h3z"/></svg>
            <span>100%</span>
        </span>
    </div>

    <!-- Tela inicial -->
    <div id="home">
        <div class="widget">
            <div class="w-time" id="w-time">--:--</div>
            <div class="w-date" id="w-date"></div>
            <div class="w-name">{{ nome }}</div>
            <div class="w-role">{{ cargo }}</div>
        </div>

        <div class="grid" id="grid">
            <button class="app" data-app="sobre"><i class="ic c-blue">👤</i><span>Sobre Mim</span></button>
            <button class="app" data-app="experiencia"><i class="ic c-teal">💼</i><span>Experiência</span></button>
            <button class="app" data-app="projetos"><i class="ic c-purple">🎬</i><span>Projetos</span></button>
            <button class="app" data-app="contato"><i class="ic c-red">✉️</i><span>Contato</span></button>

            <a class="app" href="{{ url_for('static', filename='files/curriculo-miguel-angelo.pdf') }}" target="_blank" rel="noopener"><i class="ic c-orange">📄</i><span>Currículo</span></a>
            <button class="app" data-app="creditos"><i class="ic c-gray">ℹ️</i><span>Créditos</span></button>
            <button class="app" data-app="doom"><i class="ic c-dark"><img src="{{ url_for('static', filename='icons/doomIcon.png') }}" alt=""></i><span>Doom</span></button>
            <button class="app" data-app="wolf3d"><i class="ic c-dark"><img src="{{ url_for('static', filename='icons/wolf3dIcon.png') }}" alt=""></i><span>Wolfenstein 3D</span></button>

            <button class="app" data-app="digger"><i class="ic c-dark"><img src="{{ url_for('static', filename='icons/diggerIcon.png') }}" alt=""></i><span>Digger</span></button>
            <button class="app" data-app="tetris"><i class="ic c-dark"><img src="{{ url_for('static', filename='icons/tetrisIcon.png') }}" alt=""></i><span>Tetris</span></button>
            <button class="app" data-app="scrabble"><i class="ic c-dark"><img src="{{ url_for('static', filename='icons/scrabbleIcon.png') }}" alt=""></i><span>Scrabble</span></button>
        </div>

        <div class="dock">
            <button class="app" data-app="sobre"><i class="ic c-blue">👤</i></button>
            <button class="app" data-app="projetos"><i class="ic c-purple">🎬</i></button>
            <button class="app" data-app="contato"><i class="ic c-red">✉️</i></button>
            <button class="app" data-app="tetris"><i class="ic c-dark"><img src="{{ url_for('static', filename='icons/tetrisIcon.png') }}" alt=""></i></button>
        </div>
    </div>

    <!-- App aberto (tela cheia) -->
    <div id="appview" aria-hidden="true">
        <div class="appbar">
            <button id="app-back" aria-label="Voltar">‹</button>
            <span id="app-title"></span>
        </div>
        <div id="app-body"></div>
    </div>

    <div id="toast"></div>

    <!-- Barra de navegação Android -->
    <div id="navbar">
        <button id="nav-back" aria-label="Voltar">◁</button>
        <button id="nav-home" aria-label="Início">○</button>
        <button id="nav-recent" aria-label="Recentes">□</button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/tetris.js') }}"></script>
<script src="{{ url_for('static', filename='js/android.js') }}"></script>
</body>
</html>
