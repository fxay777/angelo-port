<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#03060c">
    <title>{{ dados.nome }} — HoloFone</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/startLogo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/android.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', filename='jsdos/js-dos/js-dos.css') }}">
    <script>var emulatorsPathPrefix = "{{ url_for('static', filename='jsdos/js-dos/') }}";</script>
    <script src="{{ url_for('static', filename='jsdos/js-dos/js-dos.js') }}"></script>
    <script>
        if (typeof emulators !== 'undefined') emulators.pathPrefix = emulatorsPathPrefix;
        window.DADOS = {{ dados|tojson }};
    </script>
</head>
<body class="touch-device">
<div id="phone">
    <canvas id="fundo-holo" aria-hidden="true"></canvas>
    <div class="scanline" aria-hidden="true"></div>

    <!-- Barra de status -->
    <div id="statusbar">
        <span id="sb-clock">--:--</span>
        <span class="sb-centro" id="sb-ilha" aria-hidden="true"><i></i></span>
        <span class="sb-right">
            <span id="sb-placar" title="Seus pontos">1UP <b id="placar-pts">000000</b></span>
            <button type="button" id="sb-bateria" aria-label="Bateria"><span class="bat"><i id="bat-nivel"></i></span><b id="bat-txt">100%</b></button>
        </span>
    </div>

    <!-- Tela de bloqueio -->
    <section id="bloqueio" class="tela ativa">
        <div class="bl-relogio">
            <svg class="aneis" viewBox="0 0 300 300" aria-hidden="true">
                <circle class="a1" cx="150" cy="150" r="138"/>
                <circle class="a2" cx="150" cy="150" r="122"/>
                <circle class="a3" cx="150" cy="150" r="106"/>
                <g class="ticks"></g>
            </svg>
            <div class="bl-hora" id="bl-hora">--:--</div>
            <div class="bl-data" id="bl-data"></div>
        </div>
        <div class="bl-saudacao"><b>HOLOFONE</b><span>de {{ dados.nome }}</span></div>
        <div class="bl-start">PRESS START</div>
        <div class="bl-notif" id="bl-notif"></div>
        <div class="bl-digital">
            <button type="button" id="digital" aria-label="Segure para desbloquear">
                <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <path d="M20 46c-3-5-4-10-4-14 0-9 7-16 16-16s16 7 16 16"/><path d="M26 50c-3-5-4-11-4-17a10 10 0 0 1 20 0c0 3 0 6-1 9"/>
                    <path d="M32 54c-2-5-3-12-3-20a3 3 0 0 1 6 0c0 7 1 12 3 16"/><path d="M44 50c1-4 2-9 2-14"/><path d="M14 38c-1-2-1-4-1-6 0-11 9-19 19-19 7 0 13 4 16 9"/>
                </g></svg>
                <span class="dig-progresso"></span>
            </button>
            <div class="dig-dica" id="dig-dica">Segure a digital para dar START</div>
        </div>
    </section>

    <!-- Tela inicial -->
    <section id="home" class="tela">
        <div class="nucleo-wrap">
            <button type="button" id="nucleo" aria-label="Núcleo holográfico">
                <svg viewBox="0 0 260 260" aria-hidden="true">
                    <circle class="n1" cx="130" cy="130" r="120"/>
                    <circle class="n2" cx="130" cy="130" r="104"/>
                    <circle class="n3" cx="130" cy="130" r="86"/>
                    <circle class="n4" cx="130" cy="130" r="64"/>
                    <g class="n-orbita"><circle cx="130" cy="10" r="4"/></g>
                    <g class="n-orbita2"><circle cx="130" cy="44" r="3"/></g>
                </svg>
                <span class="nucleo-hora" id="nucleo-hora">--:--</span>
                <span class="nucleo-sub" id="nucleo-sub">SISTEMA ONLINE</span>
            </button>
            <div class="identidade">
                <div class="id-nome" id="id-nome"></div>
                <div class="id-cargo" id="id-cargo"></div>
            </div>
        </div>

        <button type="button" class="cartao-maia" data-app="maia">
            <span class="maia-olho" aria-hidden="true"><i></i></span>
            <span><b>M.A.I.A.</b><small id="maia-frase">Toque para conversar comigo.</small></span>
        </button>

        <div class="grade" id="grade"></div>

        <button type="button" id="trilha" aria-label="Rolinho passeando. Toque nele!"><canvas id="trilha-c"></canvas></button>

        <div class="dock" id="dock"></div>
    </section>

    <!-- App aberto -->
    <section id="appview" aria-hidden="true">
        <div class="appbar">
            <button type="button" id="app-voltar" aria-label="Voltar">
                <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
            <span id="app-titulo"></span>
            <button type="button" id="app-holo" hidden>✦ 3D</button>
            <span class="app-status" id="app-status">● ONLINE</span>
        </div>
        <div id="app-corpo"></div>
    </section>

    <!-- Notificações, central de controle, overlays -->
    <div id="notificacoes"></div>
    <div id="central" aria-hidden="true">
        <div class="cc-alca"></div>
        <div class="cc-titulo">CENTRAL DE CONTROLE</div>
        <div class="cc-grade">
            <button type="button" class="cc-btn" data-cc="cinema"><b>🎬</b>Modo Cinema</button>
            <button type="button" class="cc-btn" data-cc="noturna"><b>🌙</b>Visão Noturna</button>
            <button type="button" class="cc-btn ativo" data-cc="holo"><b>✦</b>Holograma</button>
            <button type="button" class="cc-btn" data-cc="clientes"><b>🔕</b>Não Perturbe Clientes</button>
            <button type="button" class="cc-btn" data-cc="lanterna"><b>🔦</b>Lanterna</button>
            <button type="button" class="cc-btn" data-cc="voz"><b>🔊</b>Voz da M.A.I.A.</button>
        </div>
        <label class="cc-brilho">Brilho<input type="range" min="25" max="100" value="100" id="cc-brilho"></label>
        <div class="cc-rodape">Arraste para cima para fechar</div>
    </div>
    <div id="holo-local" aria-hidden="true"></div>
    <div id="holo-hud" aria-hidden="true">
        <span class="hh-tit" id="hh-tit">✦ HOLOGRAMA</span>
        <button type="button" data-h="ant" aria-label="Anterior">◀</button>
        <button type="button" data-h="abrir" id="hh-abrir">VER</button>
        <button type="button" data-h="prox" aria-label="Próximo">▶</button>
        <button type="button" data-h="off" aria-label="Desligar holograma">✕</button>
    </div>
    <div id="conquista" aria-live="polite"></div>
    <div id="toast"></div>
    <div id="escurecer" aria-hidden="true"></div>
    <div class="faixas-cinema" aria-hidden="true"><i></i><i></i></div>

    <!-- Barra de navegação -->
    <div id="navbar">
        <button type="button" id="nav-voltar" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button type="button" id="nav-home" aria-label="Início"><i></i></button>
        <button type="button" id="nav-central" aria-label="Central de controle"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
</div>

<script src="{{ url_for('static', filename='js/tetris.js') }}?v=2"></script>
<script src="{{ url_for('static', filename='js/android.js') }}?v=3"></script>
<script src="{{ url_for('static', filename='js/holo-apps.js') }}?v=2"></script>
<script src="{{ url_for('static', filename='js/touchscroll.js') }}?v=1"></script>
</body>
</html>
