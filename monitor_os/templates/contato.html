{% extends "base.html" %}

{% block content %}
<h1 class="big-title">{{ contato.titulo }}</h1>
<p>{{ contato.texto }}</p>
<p><a href="mailto:{{ email }}">{{ email }}</a></p>

<hr class="divider">

<div class="resume-callout">
    <span class="resume-icon">📄</span>
    <div>
        <b>Procurando meu currículo?</b><br>
        <a href="{{ url_for('static', filename='files/' + curriculo) }}" target="_blank" rel="noopener">Visualizar</a>
        &nbsp;·&nbsp;
        <a href="{{ url_for('static', filename='files/' + curriculo) }}" download>baixar PDF</a>
    </div>
</div>

<hr class="divider">

<form class="contato-form" id="form-contato" novalidate>
    <label for="f-nome">Nome</label>
    <input id="f-nome" name="nome" type="text" autocomplete="name" required>

    <label for="f-email">E-mail</label>
    <input id="f-email" name="email" type="email" autocomplete="email" required>

    <label for="f-msg">Mensagem</label>
    <textarea id="f-msg" name="mensagem" rows="5" required></textarea>

    <!-- campo invisível anti-spam: robôs preenchem, pessoas não -->
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="honeypot" aria-hidden="true">

    <div class="form-rodape">
        <button type="submit" id="f-enviar">Enviar</button>
        <span id="f-status" class="form-status" role="status"></span>
    </div>
</form>

<script>
(function () {
    var EMAIL = {{ email|tojson }};
    var form = document.getElementById('form-contato');
    var status = document.getElementById('f-status');
    var botao = document.getElementById('f-enviar');

    function mostrar(msg, tipo) {
        status.textContent = msg;
        status.className = 'form-status ' + (tipo || '');
    }

    function abrirEmail(nome, email, msg) {
        var assunto = encodeURIComponent('Contato pelo portfólio — ' + nome);
        var corpo = encodeURIComponent(msg + '\n\n— ' + nome + ' (' + email + ')');
        window.top.location.href = 'mailto:' + EMAIL + '?subject=' + assunto + '&body=' + corpo;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var nome = form.nome.value.trim();
        var email = form.email.value.trim();
        var msg = form.mensagem.value.trim();

        if (!nome || !msg || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            mostrar('Preencha nome, um e-mail válido e a mensagem.', 'erro');
            return;
        }
        if (form._honey.value) return;

        botao.disabled = true;
        mostrar('Enviando...');

        fetch('https://formsubmit.co/ajax/' + EMAIL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
                nome: nome,
                email: email,
                mensagem: msg,
                _subject: 'Nova mensagem do portfólio — ' + nome,
                _template: 'table'
            })
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data && String(data.success) === 'true') {
                form.reset();
                mostrar('Mensagem enviada! Respondo assim que puder. 🙂', 'ok');
            } else {
                throw new Error('falhou');
            }
        })
        .catch(function () {
            mostrar('Não consegui enviar por aqui — abrindo seu app de e-mail...', 'erro');
            abrirEmail(nome, email, msg);
        })
        .finally(function () { botao.disabled = false; });
    });
})();
</script>
{% endblock %}
